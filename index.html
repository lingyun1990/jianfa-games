<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>21 天闯关门 ｜ 代谢盟 · 共栖社</title>
<style>
  :root{
    --paper:#FBF6EC; --ink:#33302A; --green:#14705A; --orange:#D2703C;
    --gold:#C9A24B; --red:#CF3E2B; --muted:#8a8170; --line:#e7dcc6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
  .wrap{max-width:460px; margin:0 auto; padding:16px 16px 40px;}
  .brand{text-align:center; margin-bottom:12px;}
  .brand .b1{font-size:11px; letter-spacing:3px; color:var(--green);}
  .brand .b2{font-size:18px; font-weight:500; margin-top:3px;}

  .status{display:flex; justify-content:space-between; align-items:center;
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:10px 14px; font-size:13px; color:var(--muted); margin-bottom:14px;}
  .status b{color:var(--green); font-weight:500;}
  .status .st{color:var(--orange); font-weight:500;}

  .hero{background:#fff; border:1px solid var(--line); border-radius:18px;
    padding:14px 12px 16px; text-align:center; margin-bottom:14px;}
  .hero .hcap{font-size:12px; color:var(--muted); margin-bottom:4px;}
  .hero .grow{width:170px; height:200px; margin:0 auto; position:relative;}
  .hero .streak{font-size:14px; color:var(--orange); font-weight:500; margin-top:6px;}
  .hero .streak span{font-size:20px;}

  .sec-t{font-size:12px; color:var(--muted); margin:0 2px 7px;}
  .wall{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:16px;}
  .cell{aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:12px; position:relative;
    border:1px solid transparent;}
  .cell.done{background:var(--green); color:#fff;}
  .cell.today{background:#fff; border:2px solid var(--orange); color:var(--orange); font-weight:500;}
  .cell.miss{background:#fff; border:1.5px dashed var(--orange); color:var(--orange);}
  .cell.lock{background:#f1e9d8; color:#bcb29c;}
  .cell .lk{font-size:11px; opacity:.7;}

  .guard{background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:13px 14px; margin-bottom:14px;}
  .guard .gt{font-size:13px; color:var(--green); font-weight:500; margin-bottom:9px;}
  .gitem{display:flex; align-items:center; gap:10px; font-size:14px; padding:8px 0;
    cursor:pointer;}
  .gitem .box{width:22px; height:22px; border-radius:7px; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; flex:none;}
  .gitem.on .box{background:var(--green); border-color:var(--green);}
  .gitem.on{color:var(--ink);}

  .today{background:#fff; border:1px solid var(--line); border-radius:18px;
    padding:16px 16px 18px; margin-bottom:16px;}
  .today .ph{display:inline-block; font-size:12px; color:#fff; background:var(--orange);
    border-radius:20px; padding:2px 11px; margin-bottom:8px;}
  .today .tt{font-size:17px; font-weight:500; margin-bottom:10px;}
  .today .tw{font-size:13.5px; line-height:1.6; color:#4a443b;}
  .today .wy{font-size:13px; line-height:1.6; color:var(--muted); margin-top:9px;
    border-top:1px dashed var(--line); padding-top:9px;}
  .today .wy b{color:var(--orange);}
  .btn{display:block; width:100%; background:var(--green); color:#fff; text-align:center;
    padding:13px; border-radius:13px; font-size:15px; font-weight:500; border:none;
    margin-top:14px; cursor:pointer;}
  .btn.ghost{background:#fff; color:var(--green); border:1px solid var(--green);}
  .btn:active{opacity:.85;}

  .row{display:flex; gap:10px; margin-bottom:16px;}
  .row .card{flex:1; background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:12px; text-align:center; cursor:pointer;}
  .row .card .ct{font-size:13px; color:var(--green); font-weight:500;}
  .row .card .cs{font-size:11px; color:var(--muted); margin-top:4px;}

  .badges{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:6px;}
  .badge{font-size:11px; color:var(--muted); background:#f1e9d8; border-radius:20px;
    padding:4px 10px;}
  .badge.on{background:var(--green); color:#fff;}

  .foot{text-align:center; font-size:11px; color:#a99f8c; margin-top:18px; line-height:1.6;}

  .modal{position:fixed; inset:0; background:rgba(40,36,30,.5); display:none;
    align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal.show{display:flex;}
  .mbox{background:var(--paper); border-radius:20px; padding:20px 18px; width:100%;
    max-width:340px; max-height:88vh; overflow:auto; text-align:center; position:relative;}
  .mbox .rt{font-size:13px; color:var(--green); letter-spacing:2px; margin-bottom:10px;}

  .reward-pop{animation:popIn .5s cubic-bezier(.2,.9,.3,1) both;}
  @keyframes popIn{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}

  .grow-wrap{width:150px; height:175px; margin:0 auto; position:relative;}
  .ring{position:absolute; left:50%; top:60px; width:70px; height:70px; margin-left:-35px;
    border-radius:50%; border:2px solid var(--gold); animation:ring .8s ease-out both;}
  @keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.9);opacity:0}}
  .pt{position:absolute; font-size:15px; color:var(--orange); animation:float 1.1s ease-out infinite;}
  @keyframes float{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-32px);opacity:0}}
  .leaf-new{transform-box:fill-box; transform-origin:center; animation:pop .55s ease-out both;}
  @keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}

  .streak-pop{font-size:15px; color:var(--orange); font-weight:500; margin:8px 0 4px;}
  .streak-pop b{font-size:22px;}
  .rdisc{width:84px; height:84px; border-radius:50%; margin:10px auto 8px;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px;
    font-weight:500; padding:8px; line-height:1.25;}
  .rname{font-size:16px; font-weight:500;}
  .rword{font-size:13px; color:var(--muted); line-height:1.6; margin-top:8px;
    border-top:1px dashed var(--line); padding-top:10px;}
  .rsecret{font-size:12px; color:var(--gold); margin-top:10px; font-weight:500;}

  .qt{font-size:13px; color:var(--muted); margin-bottom:10px;}
  .qstmt{font-size:15px; line-height:1.65; color:var(--ink); margin-bottom:16px; text-align:left;}
  .qbtns{display:flex; gap:12px;}
  .qbtns button{flex:1; padding:13px; border-radius:13px; font-size:15px; font-weight:500;
    border:1px solid var(--line); background:#fff; cursor:pointer;}
  .qbtns .t{color:var(--green); border-color:var(--green);}
  .qbtns .f{color:var(--red); border-color:var(--red);}
  .qfb{margin-top:14px; font-size:13px; line-height:1.6; text-align:left; display:none;}
  .qfb.ok{color:var(--green);}
  .qfb.no{color:var(--red);}
  .qfb .why{color:var(--muted); margin-top:6px; display:block; border-top:1px dashed var(--line); padding-top:8px;}

  .album{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .acell{border-radius:12px; padding:10px 4px; text-align:center; font-size:11px; color:#fff;
    min-height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.3;}
  .acell.lock{background:#f1e9d8; color:#bcb29c;}

  .toast{position:fixed; left:50%; bottom:60px; transform:translateX(-50%);
    background:rgba(40,36,30,.92); color:#fff; font-size:13px; padding:10px 16px;
    border-radius:22px; z-index:99; display:none; max-width:80%; text-align:center;}
  .toast.show{display:block; animation:tin .25s ease-out;}
  @keyframes tin{0%{opacity:0;transform:translate(-50%,8px)}100%{opacity:1;transform:translate(-50%,0)}}
  .mini{font-size:12px; color:var(--muted); margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="b1">代谢盟 · 共栖社</div>
    <div class="b2">21 天闯关门</div>
  </div>

  <div class="status">
    <span>第 <b id="stDay">1</b> 道</span>
    <span>已开 <b id="stOpen">0</b> / 21</span>
    <span class="st">连闯 <span id="stStreak">0</span> 天</span>
  </div>

  <div class="hero">
    <div class="hcap">共栖生命 · 你养的第 <span id="hDays">0</span> 天</div>
    <div class="grow" id="growHero"></div>
    <div class="streak" id="heroStreak">连闯 <span>0</span> 天 · 火苗还旺着</div>
  </div>

  <div class="sec-t">门墙 · 21 道</div>
  <div class="wall" id="wall"></div>

  <div class="guard">
    <div class="gt">守 · 每日两项（贯穿全程）</div>
    <div class="gitem" id="gWake" data-k="wake"><div class="box"></div><div>固定起床时间</div></div>
    <div class="gitem" id="gSun" data-k="sun"><div class="box"></div><div>晒太阳 10 分钟</div></div>
    <div class="mini">守住这两件小事，火苗才压得稳。</div>
  </div>

  <div class="today" id="todayCard"></div>

  <div class="row">
    <div class="card" id="openAlbum"><div class="ct">我的藏品册</div><div class="cs">21 件收获</div></div>
    <div class="card" id="openMile"><div class="ct">里程碑</div><div class="cs">连闯奖励</div></div>
  </div>

  <div class="badges" id="badges"></div>

  <div class="foot">
    生活打卡小工具 · 不是科学量表 · 不构成医学建议<br>
    数据只存在你这台手机，不会上传。
  </div>
  <div class="foot" style="cursor:pointer;" id="resetBtn">重新开始（清空进度）</div>
</div>

<!-- 答题卡 -->
<div class="modal" id="quiz">
  <div class="mbox">
    <div class="rt">答题开门</div>
    <div class="qt" id="qT">第 1 / 3 题</div>
    <div class="qstmt" id="qStmt"></div>
    <div class="qbtns">
      <button class="t" id="btnTrue">对</button>
      <button class="f" id="btnFalse">错</button>
    </div>
    <div class="qfb" id="qFb"></div>
  </div>
</div>

<!-- 开门庆祝 -->
<div class="modal" id="reward">
  <div class="mbox reward-pop">
    <div class="rt">开门庆祝</div>
    <div class="grow-wrap" id="growWrap"></div>
    <div class="streak-pop" id="streakPop"></div>
    <div class="rdisc" id="rDisc"></div>
    <div class="rname" id="rName"></div>
    <div class="rword" id="rWord"></div>
    <div class="rsecret" id="rSecret" style="display:none;"></div>
    <button class="btn" id="rewardClose">收下，明天见</button>
  </div>
</div>

<!-- 藏品册 -->
<div class="modal" id="album">
  <div class="mbox">
    <div class="rt">我的藏品册 · 21 件收获</div>
    <div class="album" id="albumGrid"></div>
    <button class="btn ghost" id="albumClose" style="margin-top:16px;">合上</button>
  </div>
</div>

<!-- 里程碑 -->
<div class="modal" id="mile">
  <div class="mbox">
    <div class="rt">里程碑 · 连闯奖励</div>
    <div id="mileList" style="text-align:left;"></div>
    <button class="btn ghost" id="mileClose" style="margin-top:16px;">合上</button>
  </div>
</div>

<!-- 查看已开门 -->
<div class="modal" id="view">
  <div class="mbox">
    <div class="rt" id="viewT">第 X 道门</div>
    <div class="rdisc" id="viewDisc"></div>
    <div class="rname" id="viewName"></div>
    <div class="rword" id="viewWord" style="border:none;"></div>
    <button class="btn ghost" id="viewClose" style="margin-top:14px;">知道了</button>
  </div>
</div>

<!-- 补开确认 -->
<div class="modal" id="sup">
  <div class="mbox">
    <div class="rt">补开这道门</div>
    <div class="qstmt" id="supText" style="text-align:center;"></div>
    <button class="btn" id="supYes">补开，打勾！</button>
    <button class="btn ghost" id="supNo" style="margin-top:10px;">先不</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== 数据 ===================== */
var TASKS = [
  {d:1, ph:"换", t:"换掉厨房那桶油", w:"把大豆油、玉米油、葵花籽油、菜籽油先收起来，炒菜换成初榨橄榄油、茶油或猪油（对，传统的反而更稳）。", why:"精炼种子油 Omega-6 极高，精炼过程还会产生氧化脂质。它不是毒药，是每天都在浇的那点油——身体认不出，只好一直发炎。",
   name:"新油瓶", rank:1, word:"这一手，直接把天平拨回来一格。"},
  {d:2, ph:"断", t:"断掉那一口甜", w:"今天不喝任何甜饮料，也不吃甜点，换白水或无糖茶。想喝凉的，加片柠檬。", why:"一瓶含糖饮料的糖就超了每天的推荐量。血糖过山车一走，炎症因子跟着上来；糖喂壮的是产内毒素的坏菌。",
   name:"清水盏", rank:1, word:"连甜的都放得下，你比自己以为的更稳。"},
  {d:3, ph:"断", t:"断掉深加工食品", w:"买之前翻到背面看配料表，超过 5 行的放回去。今天不碰零食、香肠、速食。", why:"乳化剂、防腐剂会磨薄肠道外面那层保护黏液。配料表越长，身体要处理的分子碎片越多。",
   name:"澄明眼", rank:1, word:"从今天起，配料表骗不了你了。"},
  {d:4, ph:"断", t:"断麸质 7 天", w:"从今天起 7 天不吃任何含麸质的食物，不碰面包馒头面条饼干蛋糕啤酒。", why:"现代小麦的麸质又密又韧，像一团钢丝球；里面的麦醇溶蛋白还会打开肠道紧密连接。这道门被反复敲开、关不上，低度炎症就起来了。",
   name:"断麸令", rank:1, word:"把钢丝球先放下，身体会自己解开那团乱麻。"},
  {d:5, ph:"断", t:"断掉一顿外卖", w:"今天至少有一顿是自己做的。哪怕只是煮个面，加把青菜、磕个蛋。", why:"外面吃的、糕点、沙拉酱，大概率用的都是种子油——因为它便宜到没有对手。",
   name:"自家灶", rank:1, word:"灶火一冒起来，身体就认你这一顿了。"},
  {d:6, ph:"断", t:"断掉今晚的熬夜", w:"23:30 前躺下，手机放到卧室外面。", why:"睡不够 7 小时，炎症指标真的会升高。这是成本最低、回报最高的一件事。",
   name:"安眠枕", rank:1, word:"这一夜，是给炎症最直接的一记刹车。"},
  {d:7, ph:"断", t:"回看这一周", w:"写下你真正断掉的那一样。一句话就行。", why:"能说得出来的改变，才是真的改变。第一周你只做一件事：先把火关小。",
   name:"断·金钥匙", rank:2, word:"第一周走完。你不是在忍，你是在重建。"},
  {d:8, ph:"换", t:"把主食换掉一半", w:"白米白面里掺一半杂粮杂豆——糙米、燕麦、鹰嘴豆都行。", why:"精制碳水升糖快、纤维还少；好菌饿着，修屏障的养料丁酸也断了供。",
   name:"杂粮穗", rank:1, word:"一半杂粮下肚，好菌就有口粮了。"},
  {d:9, ph:"换", t:"把下午的甜点换掉", w:"换成一小把原味坚果，或者一个水果。", why:"糖喂壮的是产内毒素的坏菌；坚果里的好脂肪，反而是身体真正需要的。",
   name:"原味果", rank:1, word:"下午三点那把坚果，比甜点更懂你。"},
  {d:10, ph:"换", t:"把一次蛋白换掉", w:"用深海鱼、豆制品或鸡蛋，替换一次红肉或加工肉。", why:"加工肉里的添加物和高饱和脂肪，是炎症的助燃剂。换成鱼和豆，天平就往回走一格。",
   name:"平衡秤", rank:2, word:"Omega 的天平，第一次往不点火的那边倾。"},
  {d:11, ph:"换", t:"把餐盘换得更花", w:"让植物性食物占餐盘一半以上，颜色不少于三种。", why:"深绿蔬菜、浆果、番茄、坚果里，天然的有益成分最多。不是吃素，是让盘子好看。",
   name:"五色盘", rank:1, word:"盘子里颜色越多，身体里的火就越少。"},
  {d:12, ph:"换", t:"把重口酱料换掉一部分", w:"用姜黄、黑胡椒、蒜、香草，替掉一部分沙拉酱、烧烤酱。", why:"酱料里往往藏着糖和种子油，一勺就把你刚省下来的都还回去了。",
   name:"香草束", rank:1, word:"你开始用香料说话，而不是用酱料。"},
  {d:13, ph:"换", t:"换掉「猛补」的思路", w:"把家里那堆保健品先归置到一处，今天不加新的，想清楚身体真正缺的是哪一样。", why:"加法养生让人焦虑，也让人错过真正的原因。先把不需要的拿走，身体才知道要什么。",
   name:"减法剪", rank:1, word:"剪掉那些不需要的，身体才看得见需要什么。"},
  {d:14, ph:"换", t:"回看第二周", w:"把你换掉的那样写下来，顺便告诉自己：你已经会自己判断了。", why:"第二周的目标不是听话，是学会甄选——以后自己就能挑，不必一直依赖别人。",
   name:"甄选镜", rank:2, word:"第二周走完。你已经会自己挑了。"},
  {d:15, ph:"修", t:"给菌群加一份发酵食物", w:"今天加一份无糖酸奶、纳豆或泡菜。", why:"第三周开始给原料。发酵食物里的活菌，是修墙队伍里的工友。",
   name:"发酵坛", rank:1, word:"工友到位，队伍才算真的组起来。"},
  {d:16, ph:"修", t:"把纤维吃够", w:"膳食纤维吃到 25 克左右：杂粮、豆类、深绿蔬菜一起上。", why:"纤维是好菌的口粮。缺了它，补进去的菌也留不住——只补不喂，等于白补。",
   name:"纤维束", rank:1, word:"纤维吃够，等于给好菌发了工资。"},
  {d:17, ph:"修", t:"加一份深绿色蔬菜", w:"西兰花、菠菜、油麦菜，任选一份。", why:"深绿色蔬菜里的叶绿素和抗氧化物，是给屏障的修复材料。",
   name:"深绿叶", rank:2, word:"这一口深绿，是给屏障的修复材料。"},
  {d:18, ph:"修", t:"主动加一道 Omega-3", w:"深海鱼、核桃、亚麻籽、奇亚籽，任选一样加进今天的饭里。", why:"把 Omega-6 和 Omega-3 的天平往回拉。这一步不是补品的事，是食物结构的事。",
   name:"深海鱼", rank:1, word:"天平又往回收了一格。"},
  {d:19, ph:"修", t:"把早餐重做一遍", w:"别再只有白粥咸菜——加一份蛋白（蛋、豆浆、酸奶）加一份纤维。", why:"一份只有碳水的早餐，是给身体一记血糖闷棍；加了蛋白和纤维，它才稳得住一上午。",
   name:"晨光碗", rank:1, word:"早餐重做一遍，一上午都稳。"},
  {d:20, ph:"修", t:"给自己做一顿修墙餐", w:"一顿完整的减法餐：一份蛋白、两拳蔬菜、一拳杂粮，用换过的油做。", why:"把这三周学的，落到一顿饭里。会做一顿，就会做一辈子。",
   name:"修墙砖", rank:2, word:"你会做一顿，就会做一辈子。"},
  {d:21, ph:"修", t:"结营日：回看这 21 道门", w:"把第一天的自己看一眼，再给今晚的火苗打一次分。", why:"屏障不是一天松的，也不会一天修好。但今天少往身体里加一样，它就稳一分。",
   name:"共栖之树", rank:3, word:"21 道门走完：一团火，被你养成了 21 株小苗。"}
];

var QDATA = {
  1: [
    { q:"大豆油、玉米油、葵花籽油这些常见种子油，Omega-6 含量很高，天天吃容易加重身体的慢性炎症。", a:true,
      why:"身体需要 Omega-6，但只需要一点点。现在很多家庭 Omega-6 和 Omega-3 的比例到了 20:1 甚至更高——天平歪了，身体的「炎症开关」就一直被按着，关不掉。" },
    { q:"猪油、黄油碰都不能碰，比种子油还可怕。", a:false,
      why:"要看用法和来源。草饲猪油、黄油耐高温、性质稳定，高温烹调其实比氧化的种子油更合适。真正要清走的是精炼种子油。" },
    { q:"外卖、零食、糕点、沙拉酱里，大概率都藏着种子油——因为它便宜到没有对手。", a:true,
      why:"精炼种子油无处不在，不只是家里炒菜才有。你以为自己吃得挺健康，其实每天每顿都在往身体里「浇油」。" }
  ],
  2: [
    { q:"一杯中杯全糖奶茶含糖约 50 克，而世卫组织建议一天添加糖不超过 25 克——一杯奶茶就是两天的量。", a:true,
      why:"你一杯就干了两天。而且糖藏在所有地方：酱料、酸奶、面包，你以为没吃糖，其实从早到晚一口没停过。" },
    { q:"蜂蜜、红糖、黑糖是「天然的糖」，这 21 天里可以照常喝。", a:false,
      why:"身体不区分「天然的糖」和「添加的糖」，进到血液里是一样的。这 21 天里一律断。" },
    { q:"肠道里的坏菌最爱吃的口粮是糖，好菌最爱吃的是膳食纤维。", a:true,
      why:"好菌吃蔬菜粗粮里的纤维，坏菌吃糖。你吃糖，等于给坏菌开自助餐——坏菌疯长，胀气、放屁臭、便秘就都来了。" }
  ],
  3: [
    { q:"包装上写着「0 反式脂肪酸」，就说明这个食品真的不含反式脂肪。", a:false,
      why:"国标规定每 100 克不超过 0.3 克就能标 0。配料表里只要有「氢化」两个字，说明还是用了。记住铁律：有「氢化」就不要吃。" },
    { q:"买包装食品，配料表排前三位的有白砂糖、果葡糖浆、氢化植物油，说明它的本质就是糖和油。", a:true,
      why:"前三位决定本质。糖、油、盐排在前面的，先放下。好酸奶的配料表就两样：生牛乳、乳酸菌。" },
    { q:"有些乳化剂会偷偷拆掉肠道的黏液层——也就是肠道的「防潮层」。", a:true,
      why:"研究发现卡拉胶、羧甲基纤维素这类乳化剂可能侵蚀肠道黏液层。防潮层一破，免疫系统就得天天救火，全身慢性炎症就这么起来了。" }
  ],
  4: [
    { q:"现代小麦和老祖宗吃的小麦，麸质已经不一样了——现在的麸质蛋白更多、结构也更难分解。", a:true,
      why:"上世纪五六十年代的「绿色革命」，为了高产、抗倒伏，培育出了矮秆小麦。产量上去了，代价是麸质蛋白含量大幅增加、结构也变了。" },
    { q:"反正都是小麦磨的面，传统面食和现在的面食，对肠道来说没什么两样。", a:false,
      why:"差在「预处理」。传统面食要长时间自然发酵，微生物先帮你分解掉一部分麸质；现在快速发酵粉半小时就发起来，麸质基本没动。" },
    { q:"肠道屏障那些「门」被反复敲开之后，没消化完的大分子和毒素会进到血液里，免疫系统一直拉警报——这种炎症不疼不痒，你几乎感觉不到。", a:true,
      why:"麸质里的麦醇溶蛋白会刺激肠道释放「连蛋白」——那就是打开紧密连接的开关。门关不上，就是肠漏。这就是低度炎症：一把不冒烟的文火，烧久了器官才跟着出问题。" }
  ]
};
function hasQ(d){ return !!(QDATA[d] && QDATA[d].length); }

var MILESTONES = [
  {n:3,  name:"三日不断", d:"连开 3 道门 · 解锁「起步者」"},
  {n:7,  name:"一周筑基", d:"连开 7 道门 · 第一周走完"},
  {n:14, name:"两周甄选", d:"连开 14 道门 · 第二周走完"},
  {n:21, name:"共栖圆满", d:"连开 21 道门 · 走完全程，花园落成"}
];

var BADGES = [
  {n:1,  label:"起步"},
  {n:3,  label:"三日不断"},
  {n:7,  label:"断念者"},
  {n:14, label:"甄选者"},
  {n:21, label:"筑基者 · 共栖"}
];

var RANKCOLOR = {1:"#14705A", 2:"#C9A24B", 3:"#D2703C"};

/* ===================== 状态 ===================== */
var KEY = "gongxi_v1";
function load(){
  try{ var s = JSON.parse(localStorage.getItem(KEY)); if(s && s.log) return s; }catch(e){}
  return {start:null, log:{}, guard:{}};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
var S = load();

function todayStr(){
  var t = new Date();
  return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
}
function daysBetween(a,b){
  var da=new Date(a+"T00:00:00"), db=new Date(b+"T00:00:00");
  return Math.round((db-da)/86400000);
}
function curDay(){
  if(!S.start) return 1;
  var c = daysBetween(S.start, todayStr())+1;
  return Math.max(1, Math.min(21, c));
}
function openedCount(){ return Object.keys(S.log).length; }
function openedDays(){ return Object.keys(S.log).map(Number).sort(function(a,b){return a-b;}); }
function curStreak(){
  var ds = openedDays();
  if(!ds.length) return 0;
  var last = ds[ds.length-1], st = 1;
  for(var i=ds.length-2;i>=0;i--){ if(ds[i]===last-1){ st++; last=ds[i]; } else break; }
  return st;
}

/* ===================== 共栖生命 SVG ===================== */
function growthSVG(opened, newest){
  var N=21, potTop=196, stemBot=196, stemTopMin=46;
  var stemTop = stemBot - (opened/N)*(stemBot-stemTopMin);
  var s = '<svg viewBox="0 0 200 230" width="100%" height="100%" style="display:block">';
  s += '<path d="M74 '+potTop+' L126 '+potTop+' L118 224 L82 224 Z" fill="#D2703C"/>';
  s += '<rect x="70" y="188" width="60" height="10" rx="4" fill="#C9A24B"/>';
  s += '<rect x="97" y="'+stemTop+'" width="6" height="'+(stemBot-stemTop)+'" rx="3" fill="#14705A"/>';
  for(var i=1;i<=N;i++){
    var ly = stemBot - (i/N)*(stemBot-stemTopMin) - 6;
    var side = (i%2===0)?1:-1;
    var lx = 100 + side*20;
    var filled = i<=opened;
    var cls = (i===newest)?' class="leaf-new"':'';
    var col = filled ? "#14705A" : "none";
    var st = filled ? "none" : "#d8cdb6";
    s += '<ellipse'+cls+' cx="'+lx+'" cy="'+ly+'" rx="12" ry="6.5" fill="'+col+'" stroke="'+st+'" stroke-width="1.2" transform="rotate('+(side*30)+' '+lx+' '+ly+')"/>';
  }
  if(opened>0){
    var budCls = (newest===N)?' class="leaf-new"':'';
    s += '<ellipse'+budCls+' cx="100" cy="'+(stemTop-6)+'" rx="11" ry="14" fill="#1d9e75"/>';
  }
  s += '</svg>';
  return s;
}

/* ===================== 渲染 ===================== */
function $(id){ return document.getElementById(id); }

function render(){
  var cur = curDay();
  var oc = openedCount();
  var st = curStreak();
  $("stDay").textContent = cur;
  $("stOpen").textContent = oc;
  $("stStreak").textContent = st;
  $("hDays").textContent = oc;
  $("growHero").innerHTML = growthSVG(oc, null);
  var hs = $("heroStreak");
  if(st>=14) hs.innerHTML = '连闯 <span>'+st+'</span> 天 · 快到尾声了';
  else if(st>=7) hs.innerHTML = '连闯 <span>'+st+'</span> 天 · 火已经弱了';
  else if(st>=1) hs.innerHTML = '连闯 <span>'+st+'</span> 天 · 火苗小了一圈';
  else hs.innerHTML = '连闯 <span>0</span> 天 · 今天先开一道门';

  // 门墙
  var wall = $("wall"); wall.innerHTML = "";
  for(var d=1; d<=21; d++){
    var done = !!S.log[d];
    var isToday = (d===cur);
    var miss = (!done && d<cur);
    var cell = document.createElement("div");
    var cls = "cell ";
    if(done) cls += "done";
    else if(isToday) cls += "today";
    else if(miss) cls += "miss";
    else cls += "lock";
    cell.className = cls;
    cell.innerHTML = done ? (""+d) : (isToday ? (""+d) : (miss ? (""+d) : '<span class="lk">🔒</span>'.replace("🔒","锁")));
    if(!done && !isToday && !miss) cell.innerHTML = '<span class="lk">锁</span>';
    (function(dd, dn, dt, dm){
      cell.onclick = function(){ clickDoor(dd, dn, dt, dm); };
    })(d, done, isToday, miss);
    wall.appendChild(cell);
  }

  // 守两项
  var g = S.guard[todayStr()] || {wake:false, sun:false};
  setGuard("gWake", g.wake);
  setGuard("gSun", g.sun);

  // 今日之门
  renderToday(cur);

  // 徽章
  var bd = $("badges"); bd.innerHTML = "";
  BADGES.forEach(function(b){
    var el = document.createElement("span");
    el.className = "badge" + (oc>=b.n?" on":"");
    el.textContent = b.label;
    bd.appendChild(el);
  });
}

function setGuard(id, on){
  var el = $(id);
  el.className = "gitem" + (on?" on":"");
  el.querySelector(".box").textContent = on ? "✓" : "";
}

function renderToday(cur){
  var tk = TASKS[cur-1];
  var done = !!S.log[cur];
  var phTxt = tk.ph==="断"?"停止伤害":tk.ph==="换"?"换成真需":tk.ph==="修"?"给足原料":"贯穿全程";
  var html = '<span class="ph">'+tk.ph+' · '+phTxt+'</span>'+
    '<div class="tt">第 '+cur+' 天 · '+tk.t+'</div>'+
    '<div class="tw">'+tk.w+'</div>'+
    '<div class="wy"><b>为什么</b> · '+tk.why+'</div>';
  if(done){
    html += '<button class="btn ghost" id="todayBtn">今天已开门 · 再看一眼</button>';
  } else {
    var label = hasQ(cur) ? "答题开门（3 道题）" : "直接开门";
    html += '<button class="btn" id="todayBtn">'+label+'</button>';
  }
  $("todayCard").innerHTML = html;
  $("todayBtn").onclick = function(){
    if(done){ viewDoor(cur); return; }
    openDoor(cur);
  };
}

/* ===================== 门墙点击 ===================== */
function clickDoor(d, done, isToday, miss){
  if(done){ viewDoor(d); return; }
  if(isToday){ openDoor(d); return; }
  if(miss){
    $("supText").textContent = "这是第 "+d+" 天的门，还没开过。补做一下，也算数。";
    pendingSup = d;
    show("sup");
    return;
  }
  toast("还没到这一天，先开今天的门");
}
var pendingSup = null;
$("supYes").onclick = function(){ hide("sup"); if(pendingSup!=null) openDoor(pendingSup); };
$("supNo").onclick = function(){ hide("sup"); };

/* ===================== 开门流程 ===================== */
function openDoor(d){
  if(S.log[d]){ viewDoor(d); return; }
  if(!S.start) S.start = todayStr();
  if(hasQ(d)){
    startQuiz(d);
  } else {
    celebrate(d);
  }
}

var qz = null;
function startQuiz(d){
  qz = {d:d, qi:0};
  show("quiz");
  renderQ();
}
function renderQ(){
  var qs = QDATA[qz.d];
  var item = qs[qz.qi];
  $("qT").textContent = "第 "+(qz.qi+1)+" / "+qs.length+" 题";
  $("qStmt").textContent = item.q;
  var fb = $("qFb"); fb.className = "qfb"; fb.style.display = "none"; fb.innerHTML = "";
  $("btnTrue").disabled = false; $("btnFalse").disabled = false;
}
function answer(val){
  var qs = QDATA[qz.d];
  var item = qs[qz.qi];
  var ok = (val === item.a);
  var fb = $("qFb");
  fb.style.display = "block";
  if(ok){
    fb.className = "qfb ok";
    var last = (qz.qi === qs.length-1);
    fb.innerHTML = "答对啦 ✓<span class='why'>"+item.why+"</span>"+
      "<button class='btn' id='qNext' style='margin-top:12px;'>"+(last?"三道全对 · 开门":"下一题")+"</button>";
    $("btnTrue").disabled = true; $("btnFalse").disabled = true;
    $("qNext").onclick = function(){
      if(last){ hide("quiz"); celebrate(qz.d); }
      else { qz.qi++; renderQ(); }
    };
  } else {
    fb.className = "qfb no";
    fb.innerHTML = "再想想 ✗<span class='why'>"+item.why+"</span>"+
      "<button class='btn' id='qAgain' style='margin-top:12px;'>这道题得重头再来</button>";
    $("btnTrue").disabled = true; $("btnFalse").disabled = true;
    $("qAgain").onclick = function(){ qz.qi = 0; renderQ(); };
  }
}
$("btnTrue").onclick = function(){ answer(true); };
$("btnFalse").onclick = function(){ answer(false); };

/* ===================== 开门庆祝（双引擎） ===================== */
function celebrate(d){
  if(S.log[d]) { viewDoor(d); return; }
  S.log[d] = todayStr();
  save();
  var tk = TASKS[d-1];
  var st = curStreak();
  var oc = openedCount();
  render();

  // 成长主轴 + 爆发
  $("growWrap").innerHTML = growthSVG(oc, d) +
    '<div class="ring"></div>'+
    '<div class="pt" style="left:24px;top:50px;">✦</div>'+
    '<div class="pt" style="right:22px;top:40px;color:#C9A24B;">✦</div>'+
    '<div class="pt" style="left:54px;top:30px;color:#14705A;">+</div>';
  var sp = $("streakPop");
  if(st>=2) sp.innerHTML = "连闯 <b>"+st+"</b> 天！";
  else sp.innerHTML = "第一道门开了！";
  var disc = $("rDisc");
  disc.style.background = RANKCOLOR[tk.rank];
  disc.textContent = tk.name;
  $("rName").textContent = "藏品入册 · "+tk.name;
  $("rWord").textContent = tk.word;

  var secret = $("rSecret");
  if(oc===21){
    secret.style.display = "block";
    secret.textContent = "彩蛋 · 共栖花园落成：一团火，被你养成了 21 株小苗。";
  } else if(st===7 || st===14){
    secret.style.display = "block";
    secret.textContent = "彩蛋 · 连闯 "+st+" 天，小火苗又矮了一截。";
  } else {
    secret.style.display = "none";
  }
  show("reward");
}
$("rewardClose").onclick = function(){ hide("reward"); };

/* ===================== 查看已开门 ===================== */
function viewDoor(d){
  var tk = TASKS[d-1];
  $("viewT").textContent = "第 "+d+" 道门 · 已开";
  var disc = $("viewDisc");
  disc.style.background = RANKCOLOR[tk.rank];
  disc.textContent = tk.name;
  $("viewName").textContent = tk.t;
  $("viewWord").textContent = tk.word;
  show("view");
}
$("viewClose").onclick = function(){ hide("view"); };

/* ===================== 藏品册 ===================== */
function renderAlbum(){
  var grid = $("albumGrid"); grid.innerHTML = "";
  TASKS.forEach(function(tk){
    var el = document.createElement("div");
    if(S.log[tk.d]){
      el.className = "acell";
      el.style.background = RANKCOLOR[tk.rank];
      el.innerHTML = "<div>"+tk.name+"</div>";
    } else {
      el.className = "acell lock";
      el.innerHTML = "<div>？</div>";
    }
    grid.appendChild(el);
  });
}
$("openAlbum").onclick = function(){ renderAlbum(); show("album"); };
$("albumClose").onclick = function(){ hide("album"); };

/* ===================== 里程碑 ===================== */
function renderMile(){
  var oc = openedCount();
  var list = $("mileList"); list.innerHTML = "";
  MILESTONES.forEach(function(m){
    var got = oc>=m.n;
    var div = document.createElement("div");
    div.style.cssText = "padding:11px 0;border-bottom:1px dashed var(--line);";
    div.innerHTML = "<div style='font-size:14px;font-weight:500;color:"+(got?"var(--green)":"var(--muted)")+"'>"+
      (got?"✓ ":"○ ")+m.name+"</div><div style='font-size:12.5px;color:var(--muted);margin-top:3px;'>"+m.d+"</div>";
    list.appendChild(div);
  });
}
$("openMile").onclick = function(){ renderMile(); show("mile"); };
$("mileClose").onclick = function(){ hide("mile"); };

/* ===================== 守两项 ===================== */
function toggleGuard(k){
  var t = todayStr();
  if(!S.guard[t]) S.guard[t] = {wake:false, sun:false};
  S.guard[t][k] = !S.guard[t][k];
  save();
  var g = S.guard[t];
  setGuard("gWake", g.wake);
  setGuard("gSun", g.sun);
}
$("gWake").onclick = function(){ toggleGuard("wake"); };
$("gSun").onclick = function(){ toggleGuard("sun"); };

/* ===================== 重置 ===================== */
$("resetBtn").onclick = function(){
  if(confirm("确定清空全部进度？这一下不可恢复。")){
    localStorage.removeItem(KEY);
    S = load();
    render();
    toast("已清空，重新来过");
  }
};

/* ===================== 工具 ===================== */
function show(id){ $(id).classList.add("show"); }
function hide(id){ $(id).classList.remove("show"); }
var toastTimer = null;
function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}

render();
</script>
