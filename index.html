<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>21 天闯关门 ｜ 代谢盟 · 共栖社</title>
<style>
  :root{
    --paper:#FBF6EC; --ink:#33302A; --green:#14705A; --orange:#D2703C;
    --gold:#C9A24B; --red:#CF3E2B; --muted:#8a8170; --line:#e7dcc6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    height:100%;}
  body{overflow:hidden;}

  /* ===== 起始页 ===== */
  .splash{position:fixed; inset:0; z-index:200; background:radial-gradient(circle at 50% 30%,#fdf8ee,#FBF6EC 70%);
    display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:24px;}
  .splash.hide{display:none;}
  .splash-brand{font-size:14px; letter-spacing:4px; color:var(--green);}
  .splash-sub{font-size:26px; font-weight:500; margin-top:8px; color:var(--ink);}
  .splash-door{margin:26px 0 22px;}
  .splash-btn{background:var(--green); color:#fff; border:none; padding:15px 40px; border-radius:30px;
    font-size:16px; font-weight:500; cursor:pointer; animation:breathe 2.2s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.04);opacity:1}}
  .splash-note{margin-top:16px; font-size:12px; color:var(--muted);}

  /* ===== 手机容器 ===== */
  .phone{position:relative; max-width:460px; margin:0 auto; height:100dvh; display:flex; flex-direction:column;
    background:var(--paper); overflow:hidden;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 18px 8px; flex:none;}
  .tb-brand{font-size:15px; font-weight:500; color:var(--green); letter-spacing:1px;}
  .tb-music{width:34px; height:34px; border-radius:50%; border:1.5px solid var(--green);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--green); flex:none;}
  .tb-music.off{color:#bdb29c; border-color:#d8cdb6;}

  .views{flex:1; position:relative; overflow:hidden;}
  .view{position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:none; flex-direction:column; padding:6px 18px 18px;}
  .view.active{display:flex;}

  /* ===== 今日之门 ===== */
  .mini-status{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted);
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 12px; margin-bottom:10px;}
  .mini-status b{color:var(--green); font-weight:500;}
  .mini-status .st{color:var(--orange); font-weight:500;}
  .seed-row{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .seed-row .seed{width:42px; height:48px; flex:none;}
  .seed-row .seedtxt{font-size:12.5px; color:var(--muted);}
  .seed-row .seedtxt b{color:var(--green); font-weight:500;}

  .hero-door{display:flex; justify-content:center; margin:4px 0 6px;}
  .hero-door svg{width:200px; height:240px;}

  .task-card{background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px 16px 18px; margin-top:4px;}
  .task-card .ph{display:inline-block; font-size:12px; color:#fff; background:var(--orange);
    border-radius:20px; padding:2px 11px; margin-bottom:8px;}
  .task-card .tt{font-size:17px; font-weight:500; margin-bottom:10px;}
  .task-card .tw{font-size:13.5px; line-height:1.65; color:#4a443b;}
  .task-card .wy{font-size:13px; line-height:1.65; color:var(--muted); margin-top:9px;
    border-top:1px dashed var(--line); padding-top:9px;}
  .task-card .wy b{color:var(--orange);}
  .btn{display:block; width:100%; background:var(--green); color:#fff; text-align:center;
    padding:13px; border-radius:13px; font-size:15px; font-weight:500; border:none;
    margin-top:14px; cursor:pointer;}
  .btn.ghost{background:#fff; color:var(--green); border:1px solid var(--green);}
  .btn:active{opacity:.85;}

  /* ===== 门径 · 蜿蜒小路 ===== */
  .path-head{font-size:13px; color:var(--muted); margin:4px 0 10px;}
  .path-scroll{position:relative; flex:1; overflow-y:auto; padding-bottom:10px;}
  .path-bg{position:absolute; left:0; top:0; width:100%; height:100%; z-index:0; pointer-events:none;}
  .doors{position:relative; z-index:1; display:grid; grid-template-columns:repeat(3,1fr); gap:12px 10px;}
  .doors.r2{direction:rtl;}
  .doors.r2 > *{direction:ltr;}
  .dcard{position:relative; background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:8px 4px 10px; text-align:center; cursor:pointer; transition:transform .15s;}
  .dcard:active{transform:scale(.96);}
  .dcard.done{background:var(--green); border-color:var(--green); color:#fff;}
  .dcard.today{border:2px solid var(--orange);}
  .dcard.miss{border:1.5px dashed var(--orange);}
  .dcard.future{background:#f3ecdc; border-style:dashed;}
  .dcard .darch{width:46px; height:56px; margin:0 auto 4px; display:block;}
  .dcard .dnum{font-size:12px; font-weight:500;}
  .dcard.done .dnum{color:#fff;}
  .dcard .dname{font-size:11px; margin-top:2px; line-height:1.2;}
  .dcard .dtip{font-size:11px; color:var(--orange); margin-top:2px;}
  .dcard.future .dtip{color:#bcae93;}
  .dcard.miss .dtip{color:var(--orange);}
  .dcard .fog{position:absolute; inset:0; background:rgba(243,236,220,.55); border-radius:14px;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:#9c917c;}

  /* ===== 我的共栖 ===== */
  .me-head{font-size:15px; font-weight:500; color:var(--green); margin:4px 0 8px;}
  .me-grow{width:200px; height:230px; margin:0 auto;}
  .me-streak{text-align:center; font-size:14px; color:var(--orange); font-weight:500; margin:4px 0 14px;}
  .me-streak span{font-size:20px;}
  .sec-t{font-size:12px; color:var(--muted); margin:14px 2px 8px;}
  .album{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .acell{border-radius:12px; padding:10px 4px; text-align:center; font-size:11px; color:#fff;
    min-height:60px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.3;}
  .acell.lock{background:#f3ecdc; color:#bcae93;}
  .badges{display:flex; flex-wrap:wrap; gap:7px; margin:6px 0 4px;}
  .badge{font-size:11px; color:var(--muted); background:#f3ecdc; border-radius:20px; padding:4px 10px;}
  .badge.on{background:var(--green); color:#fff;}
  .mile-list{text-align:left;}
  .mile-list .mi{padding:11px 0; border-bottom:1px dashed var(--line);}
  .mile-list .mi .mn{font-size:14px; font-weight:500; color:var(--green);}
  .mile-list .mi .md{font-size:12.5px; color:var(--muted); margin-top:3px;}

  /* ===== 底部导航 ===== */
  .tabbar{display:flex; flex:none; border-top:1px solid var(--line); background:var(--paper);}
  .tab{flex:1; padding:11px 0 13px; border:none; background:none; cursor:pointer;
    font-size:13px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px;}
  .tab .ic{font-size:18px; line-height:1;}
  .tab.on{color:var(--green); font-weight:500;}
  .tab.on .ic{transform:scale(1.12);}

  /* ===== 弹层 ===== */
  .modal{position:fixed; inset:0; background:rgba(40,36,30,.5); display:none;
    align-items:center; justify-content:center; padding:20px; z-index:120;}
  .modal.show{display:flex;}
  .mbox{background:var(--paper); border-radius:20px; padding:20px 18px; width:100%;
    max-width:340px; max-height:88vh; overflow:auto; text-align:center; position:relative;}
  .mbox .rt{font-size:13px; color:var(--green); letter-spacing:2px; margin-bottom:10px;}
  .qt{font-size:13px; color:var(--muted); margin-bottom:10px;}
  .qstmt{font-size:15px; line-height:1.65; color:var(--ink); margin-bottom:16px; text-align:left;}
  .qbtns{display:flex; gap:12px;}
  .qbtns button{flex:1; padding:13px; border-radius:13px; font-size:15px; font-weight:500;
    border:1px solid var(--line); background:#fff; cursor:pointer;}
  .qbtns .t{color:var(--green); border-color:var(--green);}
  .qbtns .f{color:var(--red); border-color:var(--red);}
  .qfb{margin-top:14px; font-size:13px; line-height:1.6; text-align:left; display:none;}
  .qfb.ok{color:var(--green);}
  .qfb.no{color:var(--red);}
  .qfb .why{color:var(--muted); margin-top:6px; display:block; border-top:1px dashed var(--line); padding-top:8px;}
  .rdisc{width:84px; height:84px; border-radius:50%; margin:10px auto 8px;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px;
    font-weight:500; padding:8px; line-height:1.25;}
  .rname{font-size:16px; font-weight:500;}
  .rword{font-size:13px; color:var(--muted); line-height:1.6; margin-top:8px;
    border-top:1px dashed var(--line); padding-top:10px;}

  .toast{position:fixed; left:50%; bottom:80px; transform:translateX(-50%);
    background:rgba(40,36,30,.92); color:#fff; font-size:13px; padding:10px 16px;
    border-radius:22px; z-index:199; display:none; max-width:80%; text-align:center;}
  .toast.show{display:block; animation:tin .25s ease-out;}
  @keyframes tin{0%{opacity:0;transform:translate(-50%,8px)}100%{opacity:1;transform:translate(-50%,0)}}

  /* ===== 开门爆发 ===== */
  .celebrate{position:fixed; inset:0; z-index:160; background:rgba(30,26,20,.78);
    display:none; align-items:center; justify-content:center; flex-direction:column; padding:20px;}
  .celebrate.show{display:flex;}
  .cel-stage{position:relative; width:260px; height:300px; display:flex; align-items:center; justify-content:center;}
  .cel-burst{position:absolute; left:50%; top:48%; width:240px; height:240px; margin:-120px 0 0 -120px;
    z-index:1; opacity:0;}
  .cel-burst.go{animation:ring2 .85s ease-out both;}
  @keyframes ring2{0%{transform:scale(.3);opacity:.95}100%{transform:scale(1.9);opacity:0}}
  .cel-ring{position:absolute; left:50%; top:48%; width:120px; height:120px; margin:-60px 0 0 -60px;
    border-radius:50%; border:3px solid var(--gold); z-index:1; opacity:0;}
  .cel-ring.go{animation:ring3 .9s ease-out both;}
  @keyframes ring3{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.4);opacity:0}}
  .cel-door{position:absolute; left:50%; top:50%; width:200px; height:240px; margin:-120px 0 0 -100px; z-index:2;}
  .cel-door svg{width:100%; height:100%;}
  .cel-door .leaf{transition:transform .55s cubic-bezier(.2,.8,.3,1);}
  .cel-door.open .leaf-l{transform:translateX(-52px);}
  .cel-door.open .leaf-r{transform:translateX(52px);}
  .cel-pt{position:absolute; left:50%; top:46%; width:10px; height:10px; border-radius:50%; z-index:3; opacity:0;}
  .cel-pt.go{animation:fly .9s ease-out both;}
  @keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:0}25%{opacity:1}
    100%{transform:translate(var(--tx),var(--ty)) scale(1);opacity:0}}
  .cel-artifact{position:absolute; left:50%; top:40%; width:96px; height:96px; margin:-48px 0 0 -48px; z-index:4;
    opacity:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:500;
    border-radius:50%;}
  .cel-artifact.go{animation:popArt .6s ease-out both;}
  @keyframes popArt{0%{transform:scale(.2);opacity:0}55%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
  .cel-word{position:relative; z-index:5; color:#fff; font-size:34px; font-weight:500; letter-spacing:6px;
    margin-top:10px; text-shadow:0 2px 12px rgba(0,0,0,.3); opacity:0;}
  .cel-word.go{animation:wordIn .5s ease-out .15s both;}
  @keyframes wordIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
  .cel-sub{position:relative; z-index:5; color:#f4d9a0; font-size:14px; margin-top:6px; opacity:0;}
  .cel-sub.go{animation:wordIn .5s ease-out .3s both;}
  .cel-btn{position:relative; z-index:5; max-width:240px; margin-top:22px; opacity:0;}
  .cel-btn.go{animation:wordIn .4s ease-out .5s both;}

  .foot{text-align:center; font-size:11px; color:#a99f8c; margin-top:16px; line-height:1.6;}
  .reset{text-align:center; font-size:12px; color:var(--muted); margin-top:10px; cursor:pointer;}
</style>
</head>
<body>

<!-- 起始页 -->
<div class="splash" id="splash">
  <div class="splash-brand">代谢盟 · 共栖社</div>
  <div class="splash-sub">21 天闯关门</div>
  <div class="splash-door">
    <svg viewBox="0 0 200 240" width="150" height="180">
      <path d="M40 230 L40 90 A60 60 0 0 1 160 90 L160 230 Z" fill="#FBF6EC" stroke="#14705A" stroke-width="3"/>
      <rect x="46" y="102" width="50" height="124" rx="4" fill="#D2703C" stroke="#14705A" stroke-width="2"/>
      <rect x="104" y="102" width="50" height="124" rx="4" fill="#D2703C" stroke="#14705A" stroke-width="2"/>
      <line x1="100" y1="102" x2="100" y2="226" stroke="#14705A" stroke-width="2"/>
      <circle cx="90" cy="166" r="4" fill="#C9A24B"/><circle cx="110" cy="166" r="4" fill="#C9A24B"/>
    </svg>
  </div>
  <button class="splash-btn" id="enterBtn">轻触推门 · 进入</button>
  <div class="splash-note">戴上耳机，有主题曲相陪</div>
</div>

<!-- 手机容器 -->
<div class="phone">
  <div class="topbar">
    <div class="tb-brand">代谢盟 · 共栖社</div>
    <div class="tb-music" id="musicBtn" title="音乐开关">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg>
    </div>
  </div>

  <div class="views">
    <!-- 今日之门 -->
    <section class="view active" id="viewToday">
      <div class="mini-status">
        <span>第 <b id="stDay">1</b> 天</span>
        <span>已开 <b id="stOpen">0</b> / 21</span>
        <span class="st">连闯 <span id="stStreak">0</span></span>
      </div>
      <div class="seed-row">
        <div class="seed" id="seedMini"></div>
        <div class="seedtxt">共栖生命 · 你养了 <b id="seedDays">0</b> 天</div>
      </div>
      <div class="hero-door">
        <svg viewBox="0 0 200 240">
          <path d="M40 230 L40 90 A60 60 0 0 1 160 90 L160 230 Z" fill="#FBF6EC" stroke="#14705A" stroke-width="3"/>
          <rect x="46" y="102" width="50" height="124" rx="4" fill="#D2703C" stroke="#14705A" stroke-width="2"/>
          <rect x="104" y="102" width="50" height="124" rx="4" fill="#D2703C" stroke="#14705A" stroke-width="2"/>
          <line x1="100" y1="102" x2="100" y2="226" stroke="#14705A" stroke-width="2"/>
          <circle cx="90" cy="166" r="4" fill="#C9A24B"/><circle cx="110" cy="166" r="4" fill="#C9A24B"/>
          <text id="heroDoorName" x="100" y="172" text-anchor="middle" font-family="serif" font-size="17" fill="#FBF6EC" font-weight="500">换油</text>
        </svg>
      </div>
      <div class="task-card" id="todayCard"></div>
    </section>

    <!-- 门径 -->
    <section class="view" id="viewPath">
      <div class="path-head">门径 · 21 道门，沿小路一路开过去</div>
      <div class="path-scroll" id="pathScroll">
        <svg class="path-bg" viewBox="0 0 320 980" preserveAspectRatio="none">
          <path d="M160 8 Q300 70 160 140 Q20 210 160 280 Q300 350 160 420 Q20 490 160 560 Q300 630 160 700 Q20 770 160 840 Q300 910 160 970"
            fill="none" stroke="#cfe3d8" stroke-width="7" stroke-dasharray="2 14" stroke-linecap="round"/>
        </svg>
        <div class="doors" id="doors"></div>
      </div>
    </section>

    <!-- 我的共栖 -->
    <section class="view" id="viewMe">
      <div class="me-head">我的共栖</div>
      <div class="me-grow" id="meGrow"></div>
      <div class="me-streak" id="meStreak">连闯 <span>0</span> 天</div>
      <div class="sec-t">藏品册 · 21 件收获</div>
      <div class="album" id="albumGrid"></div>
      <div class="sec-t">里程碑</div>
      <div class="mile-list" id="mileList"></div>
      <div class="sec-t">徽章</div>
      <div class="badges" id="badges"></div>
      <div class="foot">生活打卡小工具 · 不是科学量表 · 不构成医学建议<br>数据只存在你这台手机，不会上传。</div>
      <div class="reset" id="resetBtn">重新开始（清空进度）</div>
    </section>
  </div>

  <nav class="tabbar">
    <button class="tab on" data-v="today"><span class="ic">⛩</span>今日之门</button>
    <button class="tab" data-v="path"><span class="ic">❧</span>门径</button>
    <button class="tab" data-v="me"><span class="ic">❀</span>我的共栖</button>
  </nav>
</div>

<!-- 答题卡 -->
<div class="modal" id="quiz">
  <div class="mbox">
    <div class="rt">答题开门</div>
    <div class="qt" id="qT">第 1 / 3 题</div>
    <div class="qstmt" id="qStmt"></div>
    <div class="qbtns">
      <button class="t" id="btnTrue">对</button>
      <button class="f" id="btnFalse">错</button>
    </div>
    <div class="qfb" id="qFb"></div>
  </div>
</div>

<!-- 查看已开门 -->
<div class="modal" id="view">
  <div class="mbox">
    <div class="rt" id="viewT">第 X 道门</div>
    <div class="rdisc" id="viewDisc"></div>
    <div class="rname" id="viewName"></div>
    <div class="rword" id="viewWord" style="border:none;"></div>
    <button class="btn ghost" id="viewClose" style="margin-top:14px;">知道了</button>
  </div>
</div>

<!-- 补开确认 -->
<div class="modal" id="sup">
  <div class="mbox">
    <div class="rt">补开这道门</div>
    <div class="qstmt" id="supText" style="text-align:center;"></div>
    <button class="btn" id="supYes">补开，打勾！</button>
    <button class="btn ghost" id="supNo" style="margin-top:10px;">先不</button>
  </div>
</div>

<!-- 开门爆发 -->
<div class="celebrate" id="celebrate">
  <div class="cel-stage">
    <svg class="cel-burst" id="celBurst" viewBox="0 0 240 240">
      <g stroke="#C9A24B" stroke-width="3" opacity=".9">
        <line x1="120" y1="120" x2="120" y2="14" transform="rotate(0 120 120)"/>
        <line x1="120" y1="120" x2="120" y2="14" transform="rotate(30 120 120)"/>
        <line x1="120" y1="120" x2="120" y2="14" transform="rotate(60 120 120)"/>
        <line x1="120" y1="120" x2="120" y2="14" transform="rotate(90 120 120)"/>
        <line x1="120" y1="120" x2="120" y2="14" transform="rotate(120 120 120)"/>
        <line x1="120" y1="120" x2="120" y2="14" transform="rotate(150 120 120)"/>
        <line x1="120" y1="120" x2="120" y2="14" transform="rotate(180 120 120)"/>
        <line x1="120" y1="120" x2="120" y2="14" transform="rotate(210 120 120)"/>
        <line x1="120" y1="120" x2="120" y2="14" transform="rotate(240 120 120)"/>
        <line x1="120" y1="120" x2="120" y2="14" transform="rotate(270 120 120)"/>
        <line x1="120" y1="120" x2="120" y2="14" transform="rotate(300 120 120)"/>
        <line x1="120" y1="120" x2="120" y2="14" transform="rotate(330 120 120)"/>
      </g>
    </svg>
    <div class="cel-ring" id="celRing"></div>
    <div class="cel-door" id="celDoor">
      <svg viewBox="0 0 200 240">
        <path d="M40 230 L40 90 A60 60 0 0 1 160 90 L160 230 Z" fill="#FBF6EC" stroke="#14705A" stroke-width="3"/>
        <g class="leaf leaf-l"><path d="M44 102 L96 102 L96 226 L44 226 Z" fill="#D2703C" stroke="#14705A" stroke-width="2"/></g>
        <g class="leaf leaf-r"><path d="M104 102 L156 102 L156 226 L104 226 Z" fill="#D2703C" stroke="#14705A" stroke-width="2"/></g>
      </svg>
    </div>
    <div class="cel-pt" style="background:#D2703C;--tx:-90px;--ty:-70px;"></div>
    <div class="cel-pt" style="background:#C9A24B;--tx:90px;--ty:-60px;"></div>
    <div class="cel-pt" style="background:#14705A;--tx:-80px;--ty:60px;"></div>
    <div class="cel-pt" style="background:#D2703C;--tx:85px;--ty:55px;"></div>
    <div class="cel-pt" style="background:#C9A24B;--tx:0px;--ty:-100px;"></div>
    <div class="cel-pt" style="background:#14705A;--tx:0px;--ty:90px;"></div>
    <div class="cel-artifact" id="celArtifact"></div>
  </div>
  <div class="cel-word" id="celWord">门 开 了！</div>
  <div class="cel-sub" id="celSub"></div>
  <button class="btn cel-btn" id="celClose">收下，明天见</button>
</div>

<div class="toast" id="toast"></div>

var KEY = "gongxi_v2";
function load(){

}

function todayStr(){
  var t = new Date();
  return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
}
function daysBetween(a,b){
  var da=new Date(a+"T00:00:00"), db=new Date(b+"T00:00:00");
  return Math.round((db-da)/86400000);
}
function curDay(){
  if(!S.start) return 1;
  var c = daysBetween(S.start, todayStr())+1;
  return Math.max(1, Math.min(21, c));
}
function openedCount(){ return Object.keys(S.log).length; }
function openedDays(){ return Object.keys(S.log).map(Number).sort(function(a,b){return a-b;}); }
function curStreak(){
  var ds = openedDays();
  if(!ds.length) return 0;
  var last = ds[ds.length-1], st = 1;
  for(var i=ds.length-2;i>=0;i--){ if(ds[i]===last-1){ st++; last=ds[i]; } else break; }
  return st;
}

/* ===================== 共栖生命 SVG ===================== */
function growthSVG(opened, newest){
  var N=21, potTop=200, stemBot=200, stemTopMin=50;
  var stemTop = stemBot - (opened/N)*(stemBot-stemTopMin);
  var s = '<svg viewBox="0 0 200 230" width="100%" height="100%" style="display:block">';
  s += '<path d="M74 '+potTop+' L126 '+potTop+' L118 224 L82 224 Z" fill="#D2703C"/>';
  s += '<rect x="70" y="192" width="60" height="10" rx="4" fill="#C9A24B"/>';
  s += '<rect x="97" y="'+stemTop+'" width="6" height="'+(stemBot-stemTop)+'" rx="3" fill="#14705A"/>';
  for(var i=1;i<=N;i++){
    var ly = stemBot - (i/N)*(stemBot-stemTopMin) - 6;
    var side = (i%2===0)?1:-1;
    var lx = 100 + side*20;
    var filled = i<=opened;
    var cls = (i===newest)?' style="animation:popLeaf .55s ease-out both"':'';
    var col = filled ? "#14705A" : "none";
    var st = filled ? "none" : "#d8cdb6";
    s += '<ellipse'+cls+' cx="'+lx+'" cy="'+ly+'" rx="12" ry="6.5" fill="'+col+'" stroke="'+st+'" stroke-width="1.2" transform="rotate('+(side*30)+' '+lx+' '+ly+')"/>';
  }
  if(opened>0){
    var budCls = (newest===N)?' style="animation:popLeaf .55s ease-out both"':'';
    s += '<ellipse'+budCls+' cx="100" cy="'+(stemTop-6)+'" rx="11" ry="14" fill="#1d9e75"/>';
  }
  s += '</svg>';
  return s;
}

/* ===================== 音频 ===================== */
var AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freq, dur, type, vol, when){
  try{
    var c = ac(); if(!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    var t = c.currentTime + (when||0);
    g.gain.setValueAtTime(vol||0.15, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}

  document.querySelectorAll(".tab").forEach(function(el){ el.classList.remove("on"); });

  if(v==="path") renderPath();

}

});

  $("todayBtn").onclick = function(){ if(done){ viewDoor(cur); } else { openDoor(cur); } };
}

/* ===================== 门径 ===================== */
function doorCard(d){
  var tk = TASKS[d-1], done = !!S.log[d], cur = curDay();
  var isToday = d===cur, miss = (!done && d<cur), future = (!done && d>cur);
  var col = done ? RANKCOLOR[tk.rank] : "#e7dcc6";
  var cls = "dcard" + (done?" done":"") + (isToday?" today":"") + (miss?" miss":"") + (future?" future":"");
  var inner = done
    ? '<div class="dnum">'+d+'</div><div class="dname">'+tk.name+'</div>'
    : (isToday?'<div class="dnum">'+d+'</div><div class="dtip">今天</div>'
       : miss?'<div class="dnum">'+d+'</div><div class="dtip">补开</div>'
       : '<div class="dnum">'+d+'</div><div class="dtip">未到</div>');
  var svg = '<svg class="darch" viewBox="0 0 60 76"><path d="M8 72 L8 34 A22 22 0 0 1 52 34 L52 72 Z" fill="'+col+'" stroke="#14705A" stroke-width="2"/>'+
            '<path d="M30 72 L30 34" stroke="'+(done?"#FBF6EC":"#bcae93")+'" stroke-width="1.5"/></svg>';
  return '<div class="'+cls+'" data-d="'+d+'">'+svg+inner+'</div>';
}
function renderPath(){
  var grid = $("doors"); grid.innerHTML = "";
  for(var d=1; d<=21; d++){
    grid.insertAdjacentHTML('beforeend', doorCard(d));
    if(Math.ceil(d/3)%2===0) {} // keep order; snake via CSS direction on rows handled below
  }
  // 蛇形：偶数"行"整体反向，形成蜿蜒
  var cells = grid.children;
  // 用 order 实现蛇形
  for(var i=0;i<cells.length;i++){
    var row = Math.floor(i/3);
    if(row%2===1){ cells[i].style.order = (row*3 + (2-(i%3))); }
    else { cells[i].style.order = i; }
  }
  grid.querySelectorAll('.dcard').forEach(function(el){
    el.onclick = function(){
      var d=+el.dataset.d, done=!!S.log[d], cur=curDay(), miss=(!done&&d<cur);
      if(done) viewDoor(d);
      else if(d===cur) openDoor(d);
      else if(miss) supOpen(d);
      else toast("还没到这一天，先开今天的门");
    };
  });
}

/* ===================== 我的共栖 ===================== */
function renderMe(){
  var oc = openedCount(), st = curStreak();
  $("meGrow").innerHTML = growthSVG(oc, null);
  var ms = $("meStreak");
  if(st>=14) ms.innerHTML = '连闯 <span>'+st+'</span> 天 · 快到尾声了';
  else if(st>=7) ms.innerHTML = '连闯 <span>'+st+'</span> 天 · 火已经弱了';
  else if(st>=1) ms.innerHTML = '连闯 <span>'+st+'</span> 天 · 火苗小了一圈';
  else ms.innerHTML = '连闯 <span>0</span> 天 · 今天先开一道门';
  var grid = $("albumGrid"); grid.innerHTML = "";
  TASKS.forEach(function(tk){
    var el = document.createElement("div");
    if(S.log[tk.d]){ el.className="acell"; el.style.background=RANKCOLOR[tk.rank]; el.innerHTML="<div>"+tk.name+"</div>"; }
    else { el.className="acell lock"; el.innerHTML="<div>？</div>"; }
    grid.appendChild(el);
  });
  var ml = $("mileList"); ml.innerHTML = "";
  MILESTONES.forEach(function(m){
    var got = oc>=m.n;
    ml.insertAdjacentHTML('beforeend','<div class="mi"><div class="mn">'+(got?"✓ ":"○ ")+m.name+'</div><div class="md">'+m.d+'</div></div>');
  });
  var bd = $("badges"); bd.innerHTML = "";
  BADGES.forEach(function(b){
    var el = document.createElement("span");
    el.className = "badge"+(oc>=b.n?" on":"");
    el.textContent = b.label; bd.appendChild(el);
  });
}

/* ===================== 开门 / 答题 ===================== */
function openDoor(d){
  if(S.log[d]){ viewDoor(d); return; }
  if(!S.start) S.start = todayStr();
  if(hasQ(d)) startQuiz(d); else celebrate(d);
}
var pendingSup = null;
function supOpen(d){
  $("supText").textContent = "这是第 "+d+" 天的门，还没开过。补做一下，也算数。";
  pendingSup = d; show("sup");
}
$("supYes").onclick = function(){ hide("sup"); if(pendingSup!=null) openDoor(pendingSup); };
$("supNo").onclick = function(){ hide("sup"); };

var qz = null;
function startQuiz(d){ qz = {d:d, qi:0}; show("quiz"); renderQ(); }
function renderQ(){
  var qs = QDATA[qz.d], item = qs[qz.qi];
  $("qT").textContent = "第 "+(qz.qi+1)+" / "+qs.length+" 题";
  $("qStmt").textContent = item.q;
  var fb = $("qFb"); fb.className="qfb"; fb.style.display="none"; fb.innerHTML="";
  $("btnTrue").disabled=false; $("btnFalse").disabled=false;
}
function answer(val){
  var qs = QDATA[qz.d], item = qs[qz.qi], ok = (val===item.a), fb = $("qFb");
  fb.style.display="block";
  if(ok){
    sfxCorrect();
    var last = (qz.qi===qs.length-1);
    fb.className="qfb ok";
    fb.innerHTML = "答对啦 ✓<span class='why'>"+item.why+"</span>"+
      "<button class='btn' id='qNext' style='margin-top:12px;'>"+(last?"三道全对 · 开门":"下一题")+"</button>";
    $("btnTrue").disabled=true; $("btnFalse").disabled=true;
    $("qNext").onclick = function(){ if(last){ hide("quiz"); celebrate(qz.d); } else { qz.qi++; renderQ(); } };
  } else {
    sfxWrong();
    fb.className="qfb no";
    fb.innerHTML = "再想想 ✗<span class='why'>"+item.why+"</span>"+
      "<button class='btn' id='qAgain' style='margin-top:12px;'>这道题得重头再来</button>";
    $("btnTrue").disabled=true; $("btnFalse").disabled=true;
    $("qAgain").onclick = function(){ qz.qi=0; renderQ(); };
  }
}
$("btnTrue").onclick = function(){ answer(true); };
$("btnFalse").onclick = function(){ answer(false); };

/* ===================== 开门爆发 ===================== */
function celebrate(d){
  if(S.log[d]){ viewDoor(d); return; }
  S.log[d] = todayStr(); save();
  var tk = TASKS[d-1], st = curStreak(), oc = openedCount();
  render();

  var door = $("celDoor"), burst = $("celBurst"), ring = $("celRing");
  var art = $("celArtifact"), word = $("celWord"), sub = $("celSub"), btn = $("celClose");
  [door,burst,ring,art,word,sub,btn].forEach(function(el){ el.classList.remove("open","go"); });
  art.style.background = RANKCOLOR[tk.rank];
  art.textContent = tk.name;
  word.textContent = "门 开 了！";
  sub.textContent = (st>=2? "连闯 "+st+" 天 · " : "第一道门 · ") + tk.name + " 入册";

  var secret = "";
  if(oc===21) secret = "彩蛋 · 共栖花园落成：一团火，被你养成了 21 株小苗。";
  else if(st===7 || st===14) secret = "彩蛋 · 连闯 "+st+" 天，小火苗又矮了一截。";
  if(secret) sub.textContent += "　" + secret;

  show("celebrate");
  // 触发动画
  requestAnimationFrame(function(){
    door.classList.add("open");
    burst.classList.add("go");
    ring.classList.add("go");
    document.querySelectorAll(".cel-pt").forEach(function(p){ p.classList.add("go"); });
    art.classList.add("go");
    word.classList.add("go");
    sub.classList.add("go");
    btn.classList.add("go");
  });
  sfxOpen();
}
$("celClose").onclick = function(){ hide("celebrate"); switchView("today"); };

/* ===================== 查看已开门 ===================== */
function viewDoor(d){
  var tk = TASKS[d-1];
  $("viewT").textContent = "第 "+d+" 道门 · 已开";
  var disc = $("viewDisc"); disc.style.background = RANKCOLOR[tk.rank]; disc.textContent = tk.name;
  $("viewName").textContent = tk.t;
  $("viewWord").textContent = tk.word;
  show("view");
}
$("viewClose").onclick = function(){ hide("view"); };

/* ===================== 重置 ===================== */
$("resetBtn").onclick = function(){
  if(confirm("确定清空全部进度？这一下不可恢复。")){
    localStorage.removeItem(KEY); S = load(); render(); toast("已清空，重新来过");
  }
};

render();
</script>
<style>@keyframes popLeaf{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}</style>
